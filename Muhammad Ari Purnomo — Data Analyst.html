<!doctype html>
<html lang="id" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhammad Ari Purnomo — Data Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#2c2d32;--bg2:#26272b;--card:#37383e;--line:#4a4b52;--tx:#f4f4f5;--mu:#b8b9bf;--ac:#f0bd5a;--ac2:#f7d58a;--ac-ink:#26272b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;line-height:1.2}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:84px 0}
.alt{background:var(--bg2)}
h2.t{font-size:2rem;text-align:center;margin-bottom:44px}
h2.t.l{text-align:left}
nav{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(38,39,43,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:700 1.4rem 'Playfair Display',serif;color:var(--ac)}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-size:.92rem;color:var(--mu)}
nav ul a:hover{color:var(--ac)}
.btn{display:inline-block;border:2px solid var(--ac);color:var(--ac);padding:9px 24px;border-radius:6px;font-weight:500;cursor:pointer;background:none;font-family:inherit;font-size:.95rem}
.btn:hover,.btn.f{background:var(--ac);color:var(--ac-ink)}
.btn.f:hover{filter:brightness(1.1)}
#home{padding-top:96px;min-height:100vh;display:flex;align-items:center}
.hero{display:grid;grid-template-columns:.62fr 1.38fr;gap:24px;align-items:center}
.hero small{color:var(--mu);font-size:.72rem;letter-spacing:.12em}
.hero h1{font-size:clamp(1.4rem,2.6vw,1.9rem);color:var(--ac);margin:2px 0 6px}
.hero .role{font-size:.82rem;line-height:1.5}
.hero .hd{color:var(--mu);margin:8px 0 16px;font-size:.82rem;max-width:260px}.hero .btn{padding:5px 14px;font-size:.78rem;border-width:1.5px}.hero .soc{font-size:.75rem;margin-top:16px}
.ph{aspect-ratio:1;border-radius:24px 24px 24px 120px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;overflow:hidden;max-width:380px;margin-left:auto;width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.cut{background:none;border-radius:0;aspect-ratio:auto;max-width:none;margin:0;position:relative;overflow:visible}.ph.cut::before{content:'';position:absolute;inset:8% 4% 0 10%;border-radius:50% 50% 24px 24px;background:linear-gradient(160deg,var(--ac),var(--ac2));opacity:.9}.ph.cut{display:flex;justify-content:center}.ph.cut img{position:relative;width:100%;max-width:500px;height:auto;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}.ph span{font:700 5rem 'Playfair Display',serif;color:var(--ac-ink)}
.soc,.ct{display:flex;gap:12px}.soc{margin-top:26px}.ic{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx)}.ic:hover{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hero .soc .ic{width:34px;height:34px}.hero .soc .ic svg{width:16px;height:16px}
.about p{max-width:760px;color:#e6e6e8;margin:0 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{background:var(--card);border:1px solid var(--line);padding:4px 14px;border-radius:99px;font-size:.85rem;color:var(--mu)}
.pc .th.im{background-size:cover;background-position:center}.mi{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:16px}.sk i img{width:100%;height:100%;object-fit:contain;border-radius:8px}.sk-pv{display:grid;place-items:center;width:44px;height:44px;border-radius:8px;background:var(--card);overflow:hidden;margin:6px 0;color:var(--ac);font-weight:700}.sk-pv img{width:100%;height:100%;object-fit:contain}#about.bg{background-size:cover;background-position:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.sk{background:var(--card);border-radius:12px;padding:24px 12px;text-align:center;border:1px solid transparent;transition:.2s;font-size:.92rem}
.sk i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 12px;border-radius:12px;background:rgba(240,189,90,.12);color:var(--ac);font:700 1.1rem 'Playfair Display',serif;font-style:normal}
.sk:hover{background:var(--ac);color:var(--ac-ink);transform:translateY(-4px)}
.sk:hover i{background:rgba(0,0,0,.15);color:var(--ac-ink)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.pc{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;transition:.2s}
.pc:hover{border-color:var(--ac);transform:translateY(-4px)}
.pc .th{height:150px;display:flex;align-items:flex-end;padding:14px;font:700 .8rem Jost;letter-spacing:.14em;color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2))}
.pc .b{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.pc h3{font-size:1.2rem}.pc p{margin:0;color:var(--mu);font-size:.93rem;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font-size:.76rem;color:var(--ac);border:1px solid rgba(240,189,90,.35);padding:1px 10px;border-radius:99px}
.tl{max-width:640px;margin:0 auto;border-left:2px solid var(--line);padding-left:30px}
.ti{position:relative;margin-bottom:34px}
.ti::before{content:"";position:absolute;left:-39px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--ac2);box-shadow:0 0 0 5px var(--bg2)}
.ti .y{display:inline-block;background:var(--card);padding:0 12px;border-radius:4px;font-size:.82rem;color:var(--mu);margin-bottom:6px}
.ti h3{font-size:1.25rem}.ti p{margin:0;color:var(--mu)}
.ct{justify-content:center}.ct .ic{width:54px;height:54px}.ct .ic svg{width:24px;height:24px}
footer{text-align:center;padding:34px 24px;border-top:1px solid var(--line);color:var(--ac2);font-family:'Playfair Display',serif;font-size:1.1rem}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:none;place-items:center;padding:20px}
#modal.on{display:grid}
#modal .box{background:var(--card);max-width:560px;width:100%;border-radius:16px;padding:32px;max-height:85vh;overflow:auto;border:1px solid var(--line)}
#modal h3{font-size:1.6rem;margin-bottom:10px}#modal p{color:#e6e6e8;white-space:pre-line}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:none}
#fab.on{display:block}
#admin{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#1f2024;border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.25s;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 90px;font-size:.9rem}
#admin.on{transform:none}
#admin h4{margin:22px 0 8px;color:var(--ac);font:600 .8rem Jost;letter-spacing:.12em;text-transform:uppercase}
#admin label{display:block;color:var(--mu);font-size:.78rem;margin:8px 0 2px}
#admin input,#admin textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:8px 10px;border-radius:6px;font:inherit}
#admin textarea{min-height:70px;resize:vertical}
#admin .row{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
#admin .sm{font-size:.8rem;padding:4px 12px;margin-top:8px}
.bar{position:sticky;bottom:-72px;display:flex;gap:10px;background:#1f2024;padding:12px 0;margin-top:20px}
#msg{color:var(--ac2);font-size:.82rem;margin-top:6px}
@media(max-width:760px){nav ul{display:none}.hero{grid-template-columns:1fr}.ph{margin:0 auto;max-width:260px;order:-1}.ph.cut{max-width:none}.hero .hd{max-width:none}section{padding:60px 0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class=""><div class="box" id="mbox"></div></div>
<button class="" id="fab">✎ Admin CMS</button>
<aside id="admin" class=""></aside>

${D.about.split('\n').filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')}

<section id="skills"><div class="wrap"><h2 class="t">My Skills</h2><div class="grid">
${D.skills.map(s=>`<div class="sk"><i>${s.i?`<img src="${esc(s.i)}" alt="">`:esc(ico(s.n))}</i>${esc(s.n)}</div>`).join('')}</div></div></section>
<section id="projects" class="alt"><div class="wrap"><h2 class="t">Projects</h2><div class="pg">
${D.projects.map((x,i)=>`<article class="pc" data-i="${i}"><div class="th${x.img?' im':''}"${x.img?` style="background-image:url('${x.img}')"`:''}>${x.img?'':'PROJECT '+String(i+1).padStart(2,'0')}</div><div class="b"><h3>${esc(x.t)}</h3><p>${esc(x.s)}</p>
<div class="tags">${x.tools.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div></article>`).join('')}</div></div></section>
<section id="education"><div class="wrap"><h2 class="t">Education</h2><div class="tl">
${D.edu.map(e=>`<div class="ti"><span class="y">${esc(e.years)}</span><h3>${esc(e.school)}</h3><p>${esc(e.major)}</p></div>`).join('')}</div></div></section>
<section id="contact" class="alt"><div class="wrap"><h2 class="t">Contact Me</h2><div class="ct">
${icon('m','mailto:'+p.email,'Email')}${icon('g',c.github,'GitHub',1)}${icon('l',c.linkedin,'LinkedIn',1)}</div></div></section>
<footer>“Thanks for Scrolling”</footer>`;
document.title=p.name+' — '+p.role;
}
document.addEventListener('click',e=>{
const a=e.target.closest('.pc');
if(a){const x=D.projects[a.dataset.i];$('#mbox').innerHTML=`${x.img?`<img class="mi" src="${esc(x.img)}" alt="${esc(x.t)}">`:''}<h3>${esc(x.t)}</h3><div class="tags" style="margin-bottom:14px">${x.tools.split(',').map(t=>`<span>${esc(t.trim())}</span>`).join('')}</div><p>${esc(x.d)}</p><button class="btn" id="mx" style="margin-top:12px">Tutup</button>`;$('#modal').classList.add('on')}
if(e.target.id==='mx'||e.target.id==='modal')$('#modal').classList.remove('on');
});

/* ---------- CMS (hanya tampil untuk editor) ---------- */
let art=null;
const F=(l,path,tag='input')=>{const v=path.split('.').reduce((o,k)=>o[k],D);return `<label>${l}</label><${tag} data-p="${path}" ${tag==='input'?`value="${esc(v)}"`:''}>${tag==='textarea'?esc(Array.isArray(v)?v.join('\n'):v):''}${tag==='textarea'?'</textarea>':''}`};
function admin(){
const st=$('#admin').scrollTop;
const p='profile.';
$('#admin').innerHTML=`<h3 style="font-size:1.3rem">CMS Portofolio</h3><div style="color:var(--mu)">Ubah konten lalu klik <b>Publish</b> agar pengunjung melihat perubahan.</div>
<h4>Profil</h4>${F('Nama',p+'name')}${F('Profesi',p+'role')}${F('Spesialisasi',p+'spec')}${F('Lokasi',p+'loc')}${F('Email',p+'email')}${F('Headline',p+'headline')}
<label>Foto profil (opsional)</label><input type="file" id="ph" accept="image/*">${D.profile.photo?'<button class="btn sm" id="rph">Hapus foto</button>':''}
<h4>About</h4>${F('Deskripsi (1 paragraf per baris)','about','textarea')}
<label>Foto background About (opsional, overlay hitam otomatis)</label><input type="file" id="bg" accept="image/*">${D.aboutBg?'<button class="btn sm" id="rbg">Hapus background</button>':''}
<h4>Skills</h4>${D.skills.map((s,i)=>`<div class="row">${F('Nama skill','skills.'+i+'.n')}<label>Ikon</label><div class="sk-pv">${s.i?`<img src="${esc(s.i)}" alt="">`:esc(ico(s.n))}</div><input type="file" data-ic="${i}" accept="image/*">${s.i?`<button class="btn sm" data-rmic="${i}">Hapus ikon</button> `:''}<button class="btn sm" data-del="skills.${i}">Hapus skill</button></div>`).join('')}<button class="btn sm" id="adds">+ Skill</button>
<h4>Projects</h4>${D.projects.map((x,i)=>`<div class="row">${F('Judul','projects.'+i+'.t')}<label>Foto proyek (opsional)</label>${x.img?`<img class="mi" style="max-height:110px" src="${esc(x.img)}" alt="">`:''}<input type="file" data-pi="${i}" accept="image/*">${x.img?`<button class="btn sm" data-rmpi="${i}">Hapus foto</button> `:''}${F('Ringkasan','projects.'+i+'.s')}${F('Tools (pisah koma)','projects.'+i+'.tools')}${F('Detail','projects.'+i+'.d','textarea')}<button class="btn sm" data-del="projects.${i}">Hapus</button></div>`).join('')}
<button class="btn sm" id="addp">+ Proyek</button>
<h4>Education</h4>${D.edu.map((x,i)=>`<div class="row">${F('Institusi','edu.'+i+'.school')}${F('Jurusan','edu.'+i+'.major')}${F('Tahun','edu.'+i+'.years')}<button class="btn sm" data-del="edu.${i}">Hapus</button></div>`).join('')}
<button class="btn sm" id="adde">+ Pendidikan</button>
<h4>Kontak</h4>${F('GitHub URL','contact.github')}${F('LinkedIn URL','contact.linkedin')}
<div class="bar"><button class="btn f" id="pub">Publish</button><button class="btn" id="cls">Tutup</button></div><div id="msg"></div>`;
$('#admin').scrollTop=st;
}
function setp(path,v){const k=path.split('.');const last=k.pop();const o=k.reduce((o,x)=>o[x],D);
o[last]=(path==='skills')?v.split('\n').map(s=>s.trim()).filter(Boolean):v}
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p){setp(p,e.target.value);render()}});
document.addEventListener('click',async e=>{
const t=e.target;if(!t.closest('#admin')&&t.id!=='fab')return;
if(t.id==='fab'){admin();$('#admin').classList.add('on')}
if(t.id==='cls')$('#admin').classList.remove('on');
if(t.id==='addp'){D.projects.push({t:'Proyek baru',s:'Deskripsi singkat',tools:'SQL, Python',d:'Detail proyek',img:''});admin();render()}
if(t.id==='adde'){D.edu.push({school:'Institusi',major:'Jurusan',years:'2020–2024'});admin();render()}
if(t.dataset.del){const[a,i]=t.dataset.del.split('.');D[a].splice(+i,1);admin();render()}
if(t.dataset.rmpi!==undefined){D.projects[+t.dataset.rmpi].img='';admin();render()}
if(t.id==='adds'){D.skills.push({n:'Skill baru',i:''});admin();render()}
if(t.dataset.rmic!==undefined){D.skills[+t.dataset.rmic].i='';admin();render()}
if(t.id==='rbg'){D.aboutBg='';admin();render()}
if(t.id==='rph'){D.profile.photo='';admin();render()}
if(t.id==='pub'){
const m=$('#msg');m.textContent='Menyimpan…';
try{
const c=document.documentElement.cloneNode(true);
c.querySelector('#app').innerHTML='';c.querySelector('#admin').innerHTML='';c.querySelector('#admin').className='';c.querySelector('#mbox').innerHTML='';c.querySelector('#modal').className='';
c.querySelector('#fab').className='';
c.querySelector('#d').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
await art.publish('<!doctype html>\n'+c.outerHTML);
}catch(err){m.textContent=(err&&err.code==='conflict')?'Versi lain lebih baru, halaman dimuat ulang.':'Gagal menyimpan: '+(err&&err.message||err)}
}});
function rd(f,m,q,cb){const img=new Image();img.onload=()=>{const s=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/webp',q))};img.src=URL.createObjectURL(f)}
document.addEventListener('change',e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
if(t.id==='ph')rd(f,900,.85,u=>{D.profile.photo=u;admin();render()});
else if(t.dataset.ic!==undefined)rd(f,128,.9,u=>{D.skills[+t.dataset.ic].i=u;admin();render()});
else if(t.dataset.pi!==undefined)rd(f,900,.8,u=>{D.projects[+t.dataset.pi].img=u;admin();render()});
else if(t.id==='bg')rd(f,1600,.75,u=>{D.aboutBg=u;admin();render()})});
render();
(async()=>{try{
if(!window.claude)return;
const u=await claude.use('user');
if(u&&u.canEdit()){art=await claude.use('artifact');if(art)$('#fab').classList.add('on')}
}catch(e){}})();
</script>


</body></html>
